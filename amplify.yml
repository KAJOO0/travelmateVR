version: 1
backend:
  phases:
    build:
      commands:
        # npm ci rejects this tree (several @aws-amplify/* packages bundle conflicting
        # nested zod versions; `npm install` resolves it the same way it does locally,
        # with a benign ERESOLVE warning) — npm install is the practical choice here.
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
customHeaders:
  # Baseline security headers on every response.
  #
  # CSP notes (keep in sync with real external resources this app actually uses):
  # - script-src/style-src need 'unsafe-inline': the app sets React inline `style={{...}}`
  #   extensively (500+ call sites) and index.html has one inline theme-flash-avoidance
  #   script. Tightening these to a nonce/hash build pipeline is a safe follow-up, not done
  #   here to avoid risking a live breakage from a mismatched hash.
  # - connect-src allow-lists Cognito + AppSync (the real backend, eu-west-3) plus the
  #   OpenStreetMap tile host (the map's default tile provider, src/components/map/MapView.tsx).
  # - frame-ancestors 'none' + X-Frame-Options: DENY are redundant on purpose (CSP for modern
  #   browsers, header for older ones) — nothing in this app needs to be iframe-embedded.
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(self)'
      - key: 'Content-Security-Policy'
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://tile.openstreetmap.org;
          font-src 'self' data:;
          connect-src 'self' https://*.appsync-api.eu-west-3.amazonaws.com wss://*.appsync-realtime-api.eu-west-3.amazonaws.com https://cognito-idp.eu-west-3.amazonaws.com https://cognito-identity.eu-west-3.amazonaws.com;
          media-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
  # Private/authenticated areas: keep them out of search indexes. Public pages (home,
  # destinations, marketplace, partner pages, /signin itself, legal pages) are untouched.
  - pattern: '/account/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/bookings/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/trips/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/wishlist'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/notifications'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/help/tickets/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/business/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/board/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/admin/**'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
