version: 1
backend:
  phases:
    build:
      commands:
        # npm ci rejects this tree (several @aws-amplify/* packages bundle conflicting
        # nested zod versions; `npm install` resolves it the same way it does locally,
        # with a benign ERESOLVE warning) — npm install is the practical choice here.
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
# Security headers + private-route X-Robots-Tag live in the app's `customHeaders` config
# (set via the Amplify API/Console, not this build spec file — a `customHeaders` key here is
# silently ignored by Amplify Hosting). See docs/security/http-headers.md for the exact
# content and how to reapply it if the app is ever recreated.
